services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_DB: hotel_platform
    ports:
      - "5432:5432"
    volumes:
      - hotel_platform_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hotel_platform_pg:
