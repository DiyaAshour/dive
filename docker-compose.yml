services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_DB: hotel_platform
    ports:
      - "5432:5432"
    volumes:
      - hotel_platform_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: handmekey
      MINIO_ROOT_PASSWORD: handmekey-local-storage
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - hotel_platform_minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    volumes:
      - ./docker/minio-public-images-policy.json:/config/public-images-policy.json:ro
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 handmekey handmekey-local-storage >/dev/null 2>&1; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/hotel-platform-media;
      /usr/bin/mc anonymous set-json /config/public-images-policy.json local/hotel-platform-media;
      echo 'HandMeKey local media bucket is ready';
      exit 0;
      "

volumes:
  hotel_platform_pg:
  hotel_platform_minio:
