name: Generate Prisma Baseline

on:
  push:
    branches:
      - build/launch-readiness-search-seo
    paths:
      - .github/workflows/generate-baseline.yml

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/launch-readiness-search-seo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Generate baseline migration from the existing schema
        working-directory: packages/database
        run: |
          mkdir -p prisma/migrations/20260828000000_baseline
          npx prisma migrate diff --from-empty --to-schema prisma --script > prisma/migrations/20260828000000_baseline/migration.sql
          test -s prisma/migrations/20260828000000_baseline/migration.sql
      - name: Commit generated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/prisma/migrations/20260828000000_baseline/migration.sql
          git commit -m "chore: establish prisma production baseline"
          git push origin HEAD:build/launch-readiness-search-seo
