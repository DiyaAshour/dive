name: Launch Readiness Targeted Transform

on:
  push:
    branches:
      - build/launch-readiness-search-seo
    paths:
      - .github/workflows/launch-targeted-transform.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/launch-readiness-search-seo
          fetch-depth: 0
      - name: Apply identifier and destination synchronization changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing transform marker: {label}')
              return text.replace(old, new, 1)

          discovery = Path('packages/server/src/discovery/service.ts')
          text = discovery.read_text()
          text = replace_once(text,
              'where: {id: hotelId, status: "ACTIVE", verified: true},',
              'where: {status: "ACTIVE", verified: true, OR: [{id: hotelId}, {slug: hotelId}]},',
              'public hotel identifier')
          text = replace_once(text,
              'const reviewMap = await reviewSummaries([hotelId]);',
              'const reviewMap = await reviewSummaries([hotel.id]);',
              'public hotel review id')
          text = replace_once(text,
              'if (options.trackView !== false) await captureHotelView(hotelId, {arrival: stay.arrival, departure: stay.departure});',
              'if (options.trackView !== false) await captureHotelView(hotel.id, {arrival: stay.arrival, departure: stay.departure});',
              'public hotel view id')
          discovery.write_text(text)

          reviews = Path('packages/server/src/reviews/service.ts')
          text = reviews.read_text()
          text = replace_once(text,
              'const hotel = await database().hotel.findFirst({where: {id: hotelId, status: "ACTIVE", verified: true}, select: {id: true}});',
              'const hotel = await database().hotel.findFirst({where: {status: "ACTIVE", verified: true, OR: [{id: hotelId}, {slug: hotelId}]}, select: {id: true}});',
              'review hotel identifier')
          text = replace_once(text,
              'database().guestReview.aggregate({where: {hotelId, status: "PUBLISHED"}',
              'database().guestReview.aggregate({where: {hotelId: hotel.id, status: "PUBLISHED"}',
              'review aggregate resolved id')
          text = replace_once(text,
              'database().guestReview.findMany({where: {hotelId, status: "PUBLISHED"}',
              'database().guestReview.findMany({where: {hotelId: hotel.id, status: "PUBLISHED"}',
              'review list resolved id')
          reviews.write_text(text)

          hotels = Path('packages/server/src/hotels/service.ts')
          text = hotels.read_text()
          import_marker = 'import { database } from "@platform/database";\n'
          if 'syncHotelDestinationLinks' not in text:
              text = replace_once(text, import_marker, import_marker + 'import { syncHotelDestinationLinks } from "../discovery/destinations";\n', 'hotel destination import')
          text = replace_once(text,
              '  return db.$transaction(async (tx) => {\n',
              '  const hotel = await db.$transaction(async (tx) => {\n',
              'create hotel transaction')
          text = replace_once(text,
              '    return hotel;\n  });\n}\n\nexport async function createRoomType',
              '    return hotel;\n  });\n  await syncHotelDestinationLinks(hotel.id);\n  return hotel;\n}\n\nexport async function createRoomType',
              'create hotel sync tail')
          hotels.write_text(text)
          PY
      - name: Commit transform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/server/src/discovery/service.ts packages/server/src/reviews/service.ts packages/server/src/hotels/service.ts
          git commit -m "feat: resolve canonical hotel slugs across public services"
          git push origin HEAD:build/launch-readiness-search-seo
