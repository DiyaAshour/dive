apiVersion: apps/v1
kind: Deployment
metadata:
  name: handmekey-web
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: handmekey-web
  template:
    metadata:
      labels:
        app: handmekey-web
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: HANDMEKEY_IMAGE
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: handmekey-runtime
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3000
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3000
            failureThreshold: 3
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: handmekey-web
spec:
  selector:
    app: handmekey-web
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: handmekey-web
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: handmekey-web
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: handmekey-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: handmekey-web
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: handmekey-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: handmekey-worker
  template:
    metadata:
      labels:
        app: handmekey-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: HANDMEKEY_IMAGE
          command: ["npm", "run", "worker:holds"]
          envFrom:
            - secretRef:
                name: handmekey-runtime
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: handmekey-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: handmekey-worker
